name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # The tests start a real PostgreSQL in Docker through Testcontainers.
      - name: Run the tests
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Check that the Docker image builds
        run: docker build -t wallet-ledger-api .
