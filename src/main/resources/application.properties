spring.application.name=wallet

# Local run: these match docker-compose.yml. The tests ignore them and use a Testcontainers database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/wallet}
spring.datasource.username=${DB_USER:wallet}
spring.datasource.password=${DB_PASSWORD:wallet}

# Flyway owns the schema. Hibernate only checks that the entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
