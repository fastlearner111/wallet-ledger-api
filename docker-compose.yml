# One command runs everything:  docker compose up --build
# The API is then on http://localhost:8080 and PostgreSQL on localhost:5433.
services:
  db:
    image: postgres:18
    container_name: wallet_db
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    container_name: wallet_app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/wallet
      DB_USER: wallet
      DB_PASSWORD: wallet
    ports:
      - "8080:8080"
