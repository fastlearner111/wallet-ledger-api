# Local PostgreSQL for running the app by hand. Host port 5433 avoids clashing with other local databases.
services:
  db:
    image: postgres:18
    container_name: wallet_db
    environment:
      POSTGRES_DB: wallet
      POSTGRES_USER: wallet
      POSTGRES_PASSWORD: wallet
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wallet -d wallet"]
      interval: 5s
      timeout: 3s
      retries: 10
